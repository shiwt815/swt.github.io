<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 HAPPY BIRTHDAY ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            font-family: "Arial", "微软雅黑";
            background: linear-gradient(-45deg, #ff3cac, #784ba0, #2b86c5, #ff9a9e);
            background-size: 400% 400%;
            animation: gradientBG 8s ease infinite;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        /* 流光渐变背景 */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 全屏星光粒子 */
        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation: starTwinkle 3s infinite linear;
            z-index: 1;
        }

        @keyframes starTwinkle {
            0%,100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 专属可爱表情包印章（顶配版） */
        .stamp {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 100px;
            height: 100px;
            background: #ff3366;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            font-size: 15px;
            transform: rotate(15deg);
            box-shadow: 0 8px 25px rgba(255,51,102,0.5);
            z-index: 999;
            border: 4px solid #fff;
            animation: bounce 1.8s infinite, glow 2s infinite;
        }

        @keyframes bounce {
            0%,100%{transform:rotate(15deg) scale(1);}
            50%{transform:rotate(15deg) scale(1.1);}
        }

        @keyframes glow {
            0%,100%{box-shadow: 0 8px 25px rgba(255,51,102,0.5);}
            50%{box-shadow: 0 8px 35px rgba(255,51,102,0.9);}
        }

        /* 3D主卡片 */
        .card {
            width: 90%;
            max-width: 420px;
            height: 80vh;
            background: rgba(255,255,255,0.98);
            border-radius: 30px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.25);
            overflow: hidden;
            position: relative;
            text-align: center;
            padding: 25px;
            animation: float3d 6s ease-in-out infinite;
            transform-style: preserve-3d;
        }

        @keyframes float3d {
            0%,100%{transform: translateY(0px) rotateY(0deg);}
            25%{transform: translateY(-10px) rotateY(5deg);}
            50%{transform: translateY(0px) rotateY(0deg);}
            75%{transform: translateY(-10px) rotateY(-5deg);}
        }

        /* 多图轮播区域 */
        .swiper {
            width: 100%;
            height: 60%;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .slide {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            animation: slideAnimation 12s infinite;
        }

        .slide:nth-child(1){animation-delay: 0s;}
        .slide:nth-child(2){animation-delay: 4s;}
        .slide:nth-child(3){animation-delay: 8s;}

        @keyframes slideAnimation {
            0%{opacity: 0; transform: scale(1.1);}
            10%{opacity: 1; transform: scale(1);}
            40%{opacity: 1; transform: scale(1);}
            50%{opacity: 0; transform: scale(1.1);}
            100%{opacity: 0;}
        }

        /* 文字极简 */
        .title {
            font-size: 38px;
            color: #ff3366;
            font-weight: bold;
            background: linear-gradient(90deg, #ff3366, #ff9a9e);
            -webkit-background-clip: text;
            color: transparent;
            margin: 10px 0;
        }

        .text {
            font-size: 16px;
            color: #666;
            font-weight: 500;
        }

        .text02 {
            font-size: 16px;
            margin-top: 30px;
            color: #999;
        }

        /* 点击烟花特效 */
        .firework {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: firework 1.2s forwards;
            z-index: 999;
        }

        @keyframes firework {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(4); opacity: 0; }
        }

        /* 飘落爱心 */
        .heart {
            position: absolute;
            font-size: 22px;
            animation: heartFall 4.5s linear infinite;
            z-index: 2;
        }

        @keyframes heartFall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* 音乐按钮 */
        .music-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 50px;
            height: 50px;
            background: #ff3366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
            z-index: 999;
            box-shadow: 0 5px 15px rgba(255,51,102,0.4);
            animation: rotate 3s linear infinite;
            cursor: pointer;
            border: 2px solid white;
        }

        @keyframes rotate {
            0%{transform: rotate(0deg);}
            100%{transform: rotate(360deg);}
        }
    </style>
</head>

<body>
    <!-- 专属可爱表情包印章（独一无二） -->
    <div class="stamp">
        ✨元气少女<br>生日快乐✨
    </div>

    <!-- 音乐按钮 -->
    <div class="music-btn" onclick="toggleMusic()">🎵</div>

    <!-- 3D主卡片 -->
    <div class="card">
        <!-- 多图轮播（可替换成她的照片） -->
        <div class="swiper">
            <div class="slide" style="background-image: url('./image/1.png');"></div>
            <div class="slide" style="background-image: url('./image/2.png');"></div>
            <div class="slide" style="background-image: url('./image/3.png');"></div>
        </div>

        <div class="title">HAPPY BIRTHDAY</div>
        <div class="text">永远元气满满 · 永远闪闪发光</div>
        <div class="text02">To: 淼淼老师</div>
    </div>

    <audio id="bgm" loop>
        <source src="https://music.163.com/song/media/outer/url?id=2270535891.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 背景音乐
        const bgm = document.getElementById('bgm');
        let isPlay = false;
        function toggleMusic() {
            if(isPlay){bgm.pause()}else{bgm.play()};
            isPlay = !isPlay;
        }

        // 全屏星光
        function createStars() {
            for(let i=0;i<80;i++){
                let s = document.createElement('div');
                s.className = 'star';
                s.style.left = Math.random()*100+'vw';
                s.style.top = Math.random()*100+'vh';
                s.style.animationDelay = Math.random()*3+'s';
                document.body.appendChild(s);
            }
        }
        createStars();

        // 飘落爱心
        function dropHeart() {
            let h = document.createElement("div");
            h.className = "heart";
            h.innerText = "❤️";
            h.style.left = Math.random() * 100 + "vw";
            h.style.animationDelay = Math.random() * 4.5 + "s";
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 4500);
        }
        setInterval(dropHeart, 250);

        // 点击全屏烟花
        document.addEventListener("click", (e) => {
            for (let i = 0; i < 18; i++) {
                let f = document.createElement("div");
                f.className = "firework";
                f.style.left = e.clientX + "px";
                f.style.top = e.clientY + "px";
                f.style.background = ["#ff3366","#ffc107","#42caff","#ff9a9e","#784ba0"][Math.floor(Math.random()*5)];
                f.style.transform = `translate(${Math.random()*80-40}px, ${Math.random()*80-40}px)`;
                document.body.appendChild(f);
                setTimeout(()=>f.remove(),1200);
            }
        });
    </script>
</body>
</html>
